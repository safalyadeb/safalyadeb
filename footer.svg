<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Building ideas into digital experiences." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="50%" stop-color="#1c1235">
        <animate attributeName="stop-color" values="#1c1235;#2b1a52;#1c1235" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="120">
        <animate attributeName="width" values="0;1000;1000" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="1000" height="120" rx="16" fill="url(#fbg)"/>
  <rect x="0.5" y="0.5" width="999" height="119" rx="16" fill="none" stroke="#8b5cf6" stroke-opacity="0.35"/>
  <g clip-path="url(#reveal)">
    <text x="500" y="68" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="24" fill="#c4b5fd">Building ideas into digital experiences.</text>
  </g>
  <rect x="470" y="88" width="60" height="3" rx="1.5" fill="#8b5cf6">
    <animate attributeName="width" values="20;120;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="490;440;490" dur="4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

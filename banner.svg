<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Safalya Deb Biswas, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="50%" stop-color="#17102b">
        <animate attributeName="stop-color" values="#17102b;#241547;#17102b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4b5fd">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="280" rx="18" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#8b5cf6" stroke-opacity="0.35"/>

  <text x="60" y="70" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="15" fill="#a78bfa" letter-spacing="3">&lt;/&gt; HELLO, WORLD. I AM</text>
  <text x="60" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="url(#title)" letter-spacing="2">SAFALYA DEB BISWAS</text>
  <text x="60" y="180" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#e5e7eb" letter-spacing="8">FULL-STACK DEVELOPER</text>

  <!-- typing rotation -->
  <g font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="20" fill="#c4b5fd">
    <text x="60" y="232" opacity="0">&gt; Full-Stack Developer
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.03;0.22;0.25;0.26;0.5;0.75;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="232" opacity="0">&gt; Frontend Developer
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;0.25;0.26;0.28;0.47;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="232" opacity="0">&gt; Backend Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="232" opacity="0">&gt; Creative Problem Solver
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <rect x="330" y="214" width="10" height="22" fill="#8b5cf6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- decorative code window -->
  <g transform="translate(700 60)" opacity="0.9">
    <rect width="240" height="150" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <circle cx="20" cy="20" r="5" fill="#8b5cf6"/><circle cx="38" cy="20" r="5" fill="#6d28d9"/><circle cx="56" cy="20" r="5" fill="#4c1d95"/>
    <rect x="20" y="48" width="120" height="8" rx="4" fill="#a78bfa" fill-opacity="0.7"><animate attributeName="width" values="60;140;60" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="36" y="68" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"><animate attributeName="width" values="150;90;150" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="36" y="88" width="100" height="8" rx="4" fill="#8b5cf6" fill-opacity="0.6"><animate attributeName="width" values="100;170;100" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="20" y="108" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
